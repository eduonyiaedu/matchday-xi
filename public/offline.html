<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Matchday XI — Offline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Inter:wght@400&display=swap');
  body { font-family: Inter, system-ui, sans-serif; background: #0B1F17; color: #F5F3EC; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; text-align: center; padding: 24px; }
  .card { max-width: 360px; background: #132A20; border-radius: 16px; padding: 24px; box-shadow: inset 0 0 0 1px rgba(240,180,41,0.25); }
  p.eyebrow { margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.16em; color: #F0B429; text-transform: uppercase; }
  h1 { margin: 14px 0 0; font-family: Oswald, sans-serif; font-weight: 600; font-size: 17px; text-transform: uppercase; }
  p.body { margin: 5px 0 0; font-size: 12.5px; line-height: 1.5; color: #8A9A90; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Offline</p>
    <h1>No signal at the ground</h1>
    <p class="body">Your lineup is saved on this phone. It'll submit itself the moment you're back online — as long as that's before the lock.</p>
  </div>
</body>
</html>
