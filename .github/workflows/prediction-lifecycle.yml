name: Prediction lifecycle (lock sweep + lineup check + daily rollup + matchday notify)

# NOTE: no `schedule` trigger here on purpose. GitHub Actions' scheduler deprioritizes frequent
# cron on free/public repos badly enough in practice (confirmed: a "*/5 * * * *" schedule fired
# every 1-5 hours instead, unusable for a ~15-20 min lineup-check window) that the real 5-minute
# schedule for these three jobs is owned by cron-job.org hitting the same /api/cron/* routes
# directly — see the account at console.cron-job.org and its 3 jobs (lock-sweep, check-lineups,
# daily-rollup). This workflow is kept for manual re-testing via workflow_dispatch only.
on:
  workflow_dispatch: {}

jobs:
  lock-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/lock-sweep
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.APP_BASE_URL }}/api/cron/lock-sweep" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  check-lineups:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/check-lineups
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.APP_BASE_URL }}/api/cron/check-lineups" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  daily-rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/daily-rollup
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.APP_BASE_URL }}/api/cron/daily-rollup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  matchday-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/matchday-notify
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.APP_BASE_URL }}/api/cron/matchday-notify" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
